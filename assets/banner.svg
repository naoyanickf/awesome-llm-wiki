<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Awesome LLM Wiki">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#06090d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="4" fill="url(#accent)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="640" y="118" text-anchor="middle" fill="#e6edf3" font-size="68" font-weight="800" letter-spacing="-1">Awesome LLM Wiki</text>
    <text x="640" y="170" text-anchor="middle" fill="#8b97a5" font-size="27" font-weight="500">A self-updating map of Karpathy&#39;s LLM Wiki lineage</text>
    <text x="640" y="232" text-anchor="middle" fill="#5b6675" font-family="SF Mono,Menlo,Consolas,monospace" font-size="20">compile your sources once &#8594; an LLM keeps the wiki current</text>
  </g>
</svg>
