name: Weekly refresh

# Re-discovers LLM Wiki projects and regenerates README.md once a week.
# The built-in GITHUB_TOKEN lifts the unauthenticated search rate limit.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch + render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 agent/fetch.py
          python3 agent/render.py

      - name: Commit if changed
        run: |
          git config user.name  "llm-wiki-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain README.md data/projects.json)" ]; then
            git add README.md data/projects.json
            git commit -m "chore: weekly refresh ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes."
          fi
